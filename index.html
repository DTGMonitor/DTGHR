<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DTG HR Hub</title>
  <meta name="description" content="DTG HR Hub — people, leave and roster management for Digital Twin Geotechnical." />

  <!-- Brand mark. SVG first; the PNG wordmark is the Apple touch fallback. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/brand/dtg-logo-broken-white-mark.png" />

  <!-- Paints the browser UI in the brand navy on mobile. -->
  <meta name="theme-color" content="#0B1A22" />
  <meta name="color-scheme" content="dark" />

  <!--
    Inter + IBM Plex Mono are the corporate site's two faces. The Tailwind
    config has always named Inter, but nothing ever loaded it, so the app was
    silently falling back to the system UI font. `display=swap` keeps the first
    paint from blocking on the download.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
