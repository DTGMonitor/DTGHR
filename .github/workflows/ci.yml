name: CI

# DTG Focus baseline CI — Node/TypeScript.
# Split, single-concern jobs. START with only `build` registered as a REQUIRED
# status check (see `dtg-devkit register-ci-gate`); lint/test/types run and are
# VISIBLE but advisory. Promote each to required as its debt clears — mirror the
# main ruleset with `dtg-devkit register-ci-gate <owner/repo> --checks=build,lint,...`.
#
# Delete any job below that this repo does not have a script for.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  # Optional — keep only if the repo has a type/contract check script.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
