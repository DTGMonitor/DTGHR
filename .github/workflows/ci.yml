name: CI

# DTG Focus baseline CI — Node/TypeScript.
# Split, single-concern jobs. START with only `build` registered as a REQUIRED
# status check (see `dtg-devkit register-ci-gate`); tests and types run and are
# VISIBLE but advisory. Promote each to required as its debt clears — mirror the
# main ruleset with `dtg-devkit register-ci-gate <owner/repo> --checks=build,...`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  # Every migration applied in order to an in-memory Postgres (PGlite), then
  # the permission, workflow and arithmetic checks of each area.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:db

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc -b --noEmit
